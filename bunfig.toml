[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Bypass for Cloudflare Workers tooling (published <24h ago on 2026-09-23, needed for Workers Static Assets).
minimumReleaseAgeExcludes = ["wrangler", "@cloudflare/vite-plugin", "workerd", "miniflare"]
